name: build-macos

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS 26 + Xcode 26：液态玻璃 SDK；部署目标仍是 macOS 13
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Build and package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/package-app.sh
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.1.0"
          fi
          export BUILD="${GITHUB_RUN_NUMBER}"
          # 打 tag 发版时内置官方 Mihomo，方便下载即用；分支/PR 打精简包加快 CI
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export BUNDLE_CORE="${BUNDLE_CORE:-1}"
          else
            export BUNDLE_CORE="${BUNDLE_CORE:-0}"
          fi
          ./scripts/package-app.sh
          {
            echo "### Mihomo VPN $VERSION ($BUILD) · mihomo $(plutil -extract MVPNCoreVersion raw -o - dist/MihomoVPN.app/Contents/Info.plist 2>/dev/null || echo none)"
            echo '```'
            du -sh dist/MihomoVPN.app
            ls -l dist/MihomoVPN.app/Contents/MacOS/ dist/*.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MihomoVPN
          path: dist/*.zip
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          name: Mihomo VPN ${{ github.ref_name }}
